<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kivi, paber, käärid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  
  <body>
    <section class="container">
      <!-- Tulemuste näitamise sektsioon -->
      <div class="tulemuse-väli">
        <!-- Kasutaja ja boti tulemuse pildid -->
        <div class="tulemuse-pildid">
          <span class="kasutaja-tulemus">
            <img src="images/scissors.png" alt="User's valik image" />
          </span>
          <span class="boti-tulemus">
            <img src="images/scissors.png" alt="Bot's valik image" />
          </span>
        </div>
        <!-- Kuva mängutulemuse teave -->
        <div class="tulemus">Alusta mängu</div>
      </div>

      <!-- Valikud kasutajale -->
      <div class="valik-pildid">
        <span class="valik-pilt">
          <img src="images/rock.png" alt="Kivi pilt" />
          <p>Kivi</p>
        </span>
        <span class="valik-pilt">
          <img src="images/paper.png" alt="Paberi pilt" />
          <p>Paber</p>
        </span>
        <span class="valik-pilt">
          <img src="images/scissors.png" alt="Käärid pilt" />
          <p>Käärid</p>
        </span>
      </div>
      
    </section>
    <script src="script.js" defer></script>
  </body>
</html>
